  <figcaption><b>圖 13-A　失眠常用穴位。</b>依 WHO 西太平洋區《標準針灸穴位定位》（2008）與中國耳穴國標重繪的示意圖。寸為「骨度分寸」：腕橫紋到肘橫紋 12 寸、內踝尖到脛骨內側髁下緣 13 寸，所以每個人的 1 寸長度不同。神門在腕橫紋尺側端、尺側腕屈肌腱的橈側；內關在腕上 2 寸兩條肌腱之間；三陰交在內踝尖上 3 寸、脛骨內側緣後方。安眠是經外奇穴，沒有 WHO 標準代碼；印堂在 2006 年後的標準中歸入督脈（GV29）。第 13 章試驗（神門＋復溜）的復溜一併標出。證據強度見本章表格。</figcaption>
