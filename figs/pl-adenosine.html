<figcaption><b>圖 1-C　睡眠壓力的分子：腺苷與咖啡因。</b>醒著時神經元與星狀膠細胞消耗並釋出 ATP，細胞外的酵素（CD39、CD73）把它一路拆成腺苷，腺苷就隨清醒時數累積。腺苷作用在 A1 受體（抑制清醒神經元）與 A2A 受體（推動促眠迴路）；咖啡因的骨架和腺苷一樣是嘌呤環（右側淡黃色部分），所以能卡進受體口袋，卻不會啟動它，等於把「睏」的訊號擋掉。示意圖，突觸間隙與分子大小都經放大；腺苷的來源與受體分布在人體仍有不少未定之處。分子結構以 RDKit 依 SMILES 繪製。</figcaption>
