  <figcaption><b>圖 9-A　〈邪客〉半夏湯的兩味藥。</b>左：半夏（天南星科）全株——地下的球形<b>塊莖</b>即藥用部位，上部生鬚根；細長葉柄頂生三出複葉，葉柄上可見繁殖用的<b>珠芽</b>；綠色佛焰苞包住肉穗花序，頂端延伸成鞭狀附屬器。右：秫米，此處以高粱（Sorghum bicolor）繪出；但「秫米」究竟指高粱米，還是黏粟（糯小米），歷代注家說法不一 <span class="ev C">待查證</span>。半夏降逆化痰、秫米和胃——兩味都在「通」中焦，而不是安神。依植物誌與藥材圖鑑重繪，比例為示意。</figcaption>
