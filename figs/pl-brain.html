<figcaption><b>圖 1-A　睡眠開關在腦的哪裡。</b>人腦正中矢狀切面（右半腦內側面，臉朝左）。藍色的 VLPO／MnPO 位在視交叉正上方的前視丘下部，是「煞車」；紅色的 TMN、背側縫核、LDT/PPT、藍斑核沿著下視丘後部到腦幹背側排成一列，是「油門」，透過上行激活系統叫醒皮質；金色的 orexin 神經元夾在中間當穩定器。下方放大圖的藍色虛線是 VLPO 對清醒中樞的抑制。示意圖，依解剖教科書重繪；VLPO、外側下視丘、PPT 等其實位在中線兩側，這裡投影到正中面上，大小也經放大以便辨認。</figcaption>
</figure>
