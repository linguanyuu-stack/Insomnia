  <figcaption><b>圖 4-B　床變成「清醒的地方」。</b>同一個人，在客廳沙發看電視會打瞌睡，一走進臥室躺上床卻清醒：反覆在床上翻來覆去、看手機、擔心明天，大腦把「床」學成了「開始焦慮」的訊號（古典制約）。刺激控制法——只在想睡時上床、睡不著就起身離床、床只用來睡覺——就是把這個連結重新訓練回來，是 CBT-I 的核心零件之一。示意圖。</figcaption>
