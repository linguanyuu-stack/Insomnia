  <figcaption><b>圖 7-A　GABA-A 受體。</b>它是五個次單元圍成的氯離子通道：GABA 卡在 β/α 介面時通道打開，帶負電的 Cl⁻ 流進神經元，使膜電位更負（超極化），離放電閾值更遠，神經元就「被踩煞車」。BZD 與 Z-drug 不直接開門，而是卡在 α/γ 介面這個另外的位置，讓 GABA 開門的效果更強（正向異位調節）——所以兩者結構不同、作用與副作用卻相似。示意圖，依結構生物學教科書重繪；次單元比例、螺旋數與電位數值皆簡化。</figcaption>
