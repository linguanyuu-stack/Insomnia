  <figcaption><b>圖 7-E　抗組織胺為什麼會想睡。</b>清醒時，後下視丘的結節乳頭核（TMN）送出組織胺，散布到大腦皮質維持警醒。第一代抗組織胺（如苯海拉明）脂溶性高、能進入腦部，佔住 H1 受體讓這個清醒訊號被擋下來，於是產生睡意。但它同時阻斷乙醯膽鹼（抗膽鹼作用），常帶來隔天宿醉般的昏沉、口乾、尿滯留、老年人認知混亂；而且很快產生耐受，連用幾晚效果就變差，突然停用還會反彈——所以失眠證據有限、不建議長期當安眠藥用。示意圖：腦區與突觸為概念示意，依神經解剖教科書簡化重繪。</figcaption>
