  <figcaption><b>圖 12-A　更年期的下半夜醒：熱潮紅。</b>停經前後雌激素下降，下視丘弓狀核的 KNDy 神經元失去抑制而過度活化，使視前區體溫調節中樞的「舒適溫度帶」（出汗與發抖閾值之間）變得很窄；夜裡核心體溫只要小幅上升就越過出汗閾值，引發血管擴張、潮紅、出汗，人也跟著醒來。熱潮紅在圍停經期可同時是失眠的誘發與維持因子，處理它本身就是治療的一部分。示意圖，溫度帶寬度為誇張化表示。</figcaption>
