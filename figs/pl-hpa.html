<figcaption><b>圖 1-D　第三股力量：壓力軸（HPA axis）與交感神經。</b>情緒與威脅經杏仁核送到下視丘室旁核（PVN），PVN 分泌 CRH，經下視丘–腦下垂體門脈讓前葉釋出 ACTH；ACTH 隨血流到腎臟上方的腎上腺，促使皮質（束狀帶）分泌皮質醇；同一時間交感神經直接讓髓質釋出腎上腺素。皮質醇回到腦負回饋 PVN 與腦下垂體。Saper 等指出 CRH 神經元也直接推動 orexin 神經元，所以壓力會把「油門」踩住。示意圖，依解剖教科書重繪；腎上腺比例放大，杏仁核位在顳葉內側，圖中為投影位置。</figcaption>
