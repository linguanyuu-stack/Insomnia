  <figcaption><b>圖 7-D　褪黑激素：夜間的訊號。</b>松果體位於第三腦室後方、上丘上方（矢狀面示意）。它把色胺酸一路轉成褪黑激素，關鍵的限速酶 AANAT 只在夜間、黑暗時活化——所以褪黑激素是「天黑了」的化學訊號，夜間濃度上升、清晨回落。血漿濃度在入睡前的微光下開始上升（DLMO），年長者的高峰明顯較低、較平，這也是為什麼補充褪黑激素對某些長者或時差／相位問題較有道理，而對一般失眠效果很小（入睡只快數分鐘）。示意圖：腦部與分泌量為概念示意，酵素與數值依生理學教科書簡化，非個別實測。</figcaption>
</figure>
