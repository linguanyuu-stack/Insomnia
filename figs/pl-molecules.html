  <figcaption><b>圖 7-B　幾顆常見分子的骨架式。</b>BZD（diazepam、triazolam）共用淡藍底標出的 1,4-苯二氮平（1,4-benzodiazepine）環，Z-drug 的骨架完全不同，卻卡在 GABA-A 受體上同一個結合位，所以作用相似；褪黑激素與 ramelteon、GABA 等則長得各不相同。半衰期取自本章表格（NEJM 2024），diazepam 為教科書約略值，個人差異大。結構以 RDKit 依 SMILES 繪製（立體化學依藥典；doxepin 為 E/Z 混合物，圖中未標雙鍵構型）。</figcaption>
