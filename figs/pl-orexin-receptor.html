  <figcaption><b>圖 7-C　Orexin 受體與 DORA。</b>OX1R、OX2R 都是七次跨膜的 G 蛋白偶合受體（GPCR）。左：下視丘外側區送來的 orexin-A（33 個胺基酸、兩個雙硫鍵）與 orexin-B（28 個胺基酸，偏好 OX2R）插進受體頂端的口袋，經 Gq 讓清醒中樞神經元興奮；右：suvorexant 這類雙重拮抗劑（DORA）先佔住兩種受體的口袋，orexin 進不去，清醒推力被拿掉一部分——是「鬆開油門」，不是像 BZRA 那樣全面「踩煞車」。示意圖：螺旋攤成一排畫（實際為環狀束），胜肽與藥物比例放大，結構依文獻重繪。</figcaption>
