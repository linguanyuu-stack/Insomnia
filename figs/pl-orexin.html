<figcaption><b>圖 1-E　Orexin 神經元：開關上的穩定器。</b>外側下視丘的 orexin 神經元只有數萬個，軸突卻投射到藍斑核、結節乳頭核、背側縫核、LDT/PPT 與大腦皮質，沿途膨體釋出 orexin，把清醒中樞穩定在「開」。它同時收到情緒（邊緣系統）與代謝訊號：空腹時 leptin 低、ghrelin 高、血糖低都會推它一把，所以餓、怕、興奮時特別難睡。下方小圖：第一型猝睡症的人約九成 orexin 神經元消失，開關不穩，REM 的肌肉無力會闖入清醒，大笑時突然腿軟跌坐（猝倒）。示意圖，神經元形態與數量比例為教學簡化。</figcaption>
