  <figcaption><b>圖 3-B　阻塞型睡眠呼吸中止（OSA）：氣道在哪裡塌陷。</b>左為清醒時的頭頸正中矢狀切面，空氣（淡藍）從鼻腔經鼻咽、口咽、下咽進入喉與氣管。右為睡眠中（多為仰躺）：咽部肌肉與頦舌肌張力下降，①軟顎與懸雍垂往後貼到咽後壁、②舌根後倒，口咽段被堵住（紅色）；胸腹仍在用力，但氣流中斷、血氧下降，直到大腦短暫醒來把氣道撐開——這種一夜數十次的「微覺醒」，病人常只說「睡不好、白天很睏」。許多安眠藥會讓它惡化，所以打鼾、目擊停止呼吸要先篩檢（STOP-Bang）。示意圖，依解剖教科書重繪，比例簡化；右圖為左圖的鏡像。</figcaption>
