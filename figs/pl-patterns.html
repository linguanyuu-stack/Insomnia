  <figcaption><b>圖 3-A　三種症狀型態。</b>同樣說「睡不好」，病人躺在床上的樣子不一樣：(a) 上床後遲遲睡不著；(b) 睡著了，但半夜醒來很久睡不回去；(c) 比預定時間早醒、窗外還是黑的，就再也睡不著。下方時間條用藍色表示睡著、橘色斜線表示清醒躺在床上。型態影響選藥（短半衰期 vs 維持型藥物）與鑑別（凌晨醒要想到相位前移、酒精、憂鬱、夜尿、呼吸中止、熱潮紅）；實際上混合型最多，型態也會隨時間改變。示意圖。</figcaption>
