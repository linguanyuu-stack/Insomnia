  <figcaption><b>圖 3-C　兩個長得像失眠的病。</b>左：不寧腿症候群——病人是醒著的，傍晚躺下休息時小腿深處（腓腸肌、比目魚肌一帶）出現蟲爬、酸麻般難以形容的不適與想動的衝動，起來走就緩解；症狀有明顯的晝夜節律。右：REM 睡眠行為障礙——病人是睡著的，在 REM 期把夢「演」出來，揮拳、踢腳、大叫，常傷到伴侶；PSG 上可見 REM 期本該消失的肌肉張力仍在（下巴肌電爆發）。RBD 常與神經退化性疾病有關、SSRI/SNRI 也可能誘發，應轉神經科或睡眠中心。示意圖。</figcaption>
