<figcaption><b>圖 1-B　視交叉上核：身體的主時鐘。</b>①光進入眼睛，被含 melanopsin 的視網膜感光節細胞（ipRGC）接收；②訊號沿視神經中的視網膜下視丘徑送到緊貼視交叉上方的 SCN；③SCN 把時間訊號交給室旁核 PVN；④PVN 經腦幹、脊髓下行到上胸段的中間外側柱，再出到交感神經鏈、往上到上頸神經節；⑤節後纖維沿頸內動脈回到顱內支配松果體。白天光線讓 SCN 壓住這條路，褪黑激素幾乎不分泌；天黑後路徑打開，褪黑激素才上升。示意圖，依解剖與生理教科書重繪；眼睛與交感神經鏈其實在中線外側，這裡投影到同一個矢狀面。</figcaption>
</figure>
