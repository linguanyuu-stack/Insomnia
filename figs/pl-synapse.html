  <figcaption><b>圖 8-A　受體適應：反彈從哪裡來。</b>①平常 GABA 開門讓 Cl⁻ 流入，神經元被適度抑制。②每晚用 BZRA 加強每個受體，大腦為了回到平衡，把部分受體內吞、改變亞基組成，受體「變少、變鈍」——藥效於是打折（耐受），身體也開始依賴藥物撐住抑制（生理依賴）。③突然停藥時，藥的加強不見了，但受體還停在適應後的狀態，抑制不足、興奮過頭，表現為反彈性失眠與戒斷症狀。④逐步減量讓受體有時間跟著恢復。抑制力橫條中的虛線代表正常水準。示意圖：受體調節機制簡化（實際包含內吞、亞基轉錄與磷酸化等多種變化），曲線為概念示意，非實測資料。</figcaption>
