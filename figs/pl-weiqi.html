  <figcaption><b>圖 9-B　衛氣的晝夜路線。</b>依《靈樞》〈衛氣行〉〈邪客〉〈大惑論〉重繪的<b>中醫理論示意圖，不是解剖圖</b>：白天衛氣行於體表與四肢（陽），目張；夜裡從足少陰入腎，依腎→心→肺→肝→脾的順序在五藏間周行（陰），目瞑。陽蹻、陰蹻兩脈各單側繪出，都上行到目內眥（睛明）。下排：〈邪客〉說的病不是陽多或陰少，而是「厥氣客於五藏六府」把門堵住，衛氣只能留在陽分、陽蹻盛而目不瞑；半夏湯的用意是把門打開。五藏位置為簡化示意。</figcaption>
