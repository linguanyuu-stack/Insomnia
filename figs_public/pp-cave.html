<figcaption><b>圖 1·B　把人關進沒有時鐘的地方。</b>1938 年，睡眠研究先驅克萊特曼和學生理查森在肯塔基州猛瑪洞住了 32 天，想把一天拉長成 28 小時；床腳泡在水桶裡防老鼠。結果身體很難跟著改，尤其年紀較長的克萊特曼。後來在完全隔絕時間線索的實驗室裡看得更清楚：右圖每一列是一天，藍色是睡眠——有日光時每晚準時入睡（上段），看不到日光後，入睡時間每天往後挪一點，排成一條斜線（下段）。人物為示意，非肖像。</figcaption>
