  <figcaption><b>圖 6·A　失眠認知行為治療 CBT-I 的工具箱。</b>CBT-I 不是單一招式，而是一組搭配使用的工具：睡眠限制、刺激控制、放鬆訓練、認知調整與睡眠衛生，再加上每天的睡眠日誌，由專業人員依你的狀況逐週調整。各國臨床指引都把它列為慢性失眠的第一線治療；睡眠限制等步驟最好在醫師或心理師指導下進行。示意圖，時間僅為舉例。</figcaption>
