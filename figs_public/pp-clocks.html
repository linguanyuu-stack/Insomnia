<figcaption><b>圖 1·D　全身都是時鐘。</b>不只腦袋，肝臟、心臟、腸胃、胰臟、肌肉、皮膚、脂肪細胞裡都有自己的小時鐘。坐鎮在眼睛後方、視神經交叉正上方的「視交叉上核」像樂團指揮：早上的光線從眼睛進來替它校時，它再把時間傳給全身；吃飯、運動、冷熱也能微調部分器官的時鐘，但力量較小。示意圖，器官位置與大小經簡化。</figcaption>
