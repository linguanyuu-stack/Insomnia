<text x="246" y="475" class="le" style="font-size:12.5px">The plant carries its own inner clock — it keeps time even in the dark.</text>
<text x="380" y="502" class="ls" text-anchor="middle" style="font-size:10.5px;fill:#8a6a3a">示意圖：植物大小、櫃子與人物皆為示意；人物為示意，非肖像。</text>

<figcaption><b>圖 1·A　黑暗中仍「記得時間」的含羞草。</b>含羞草白天把小葉張開，天黑後合起來、葉柄垂下。1729 年，法國天文學家德梅朗（de Mairan）把它放進不見天日的櫃子裡，發現它照樣在白天張開、夜裡合起——可見節律不是陽光「推」出來的，而是植物體內自己有個時鐘。人物為示意，非肖像。</figcaption>
