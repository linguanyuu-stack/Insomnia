  <figcaption><b>圖 4·B　油門和煞車同時踩。</b>失眠的人並不是缺少睡意，而是「清醒系統」（壓力、焦慮、警覺）的油門一直沒放開，蓋過了「睡眠系統」的煞車：引擎轉速衝上紅線，車子卻原地不動——躺了一整晚，身體卻休息不到。治療的重點因此是鬆開油門，而不是更用力地逼自己睡。比喻示意圖。</figcaption>
