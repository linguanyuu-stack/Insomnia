  <figcaption><b>圖 4·C　「我整晚都沒睡」：感覺和儀器的落差。</b>上圖是她記得的夜晚：一直在擔心、每次看鐘都醒著；下方是同一夜的睡眠檢查，她其實睡了好幾個小時，只是多半是淺睡，中間夾著幾次短暫醒來——剛好就是她記得看過鐘的那幾刻。這種落差很常見，並不代表失眠是想像出來的，而是失眠者的大腦在淺睡時仍偏「醒」。時數為示意。</figcaption>
