  <figcaption><b>圖 7·A　這些情況，請找醫師。</b>失眠有時只是表面，背後可能是需要另外治療的睡眠疾病或身心問題：打鼾合併呼吸暫停、白天嚴重嗜睡、腿部不適一定要動、睡夢中拳打腳踢、情緒低落甚至想傷害自己，以及長期使用安眠藥想停藥。出現這些情況，請先就醫評估，不要只靠自己調整。若有傷害自己的念頭，請立即撥打安心專線 1925（24 小時免付費）或 119。人物為示意。</figcaption>
